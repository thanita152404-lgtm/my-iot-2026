<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home IoT Control Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ตั้งค่าสีพื้นหลังและฟอนต์ */
        body {
            background-color: #0d1117; /* สีพื้นหลังหลักแบบ Dark Mode */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #ffffff;
        }

        /* กล่อง Panel หลัก */
        .control-panel {
            background-color: #161b22; /* สีพื้นหลังกล่อง */
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        /* ส่วนหัวเรื่องและเอฟเฟกต์นีออน */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #00ffff;
            margin: 0;
            font-size: 28px;
            letter-spacing: 2px;
            text-transform: uppercase;
            /* เอฟเฟกต์เรืองแสง */
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7), 0 0 20px rgba(0, 255, 255, 0.5);
        }
        .header p {
            color: #8b949e;
            margin-top: 5px;
            font-size: 14px;
        }

        /* กล่องควบคุมแต่ละช่อง (Channel Card) */
        .channel-card {
            background-color: #21262d;
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }

        .channel-info {
            display: flex;
            align-items: center;
            font-size: 18px;
            font-weight: 500;
        }

        .channel-info i {
            margin-right: 15px;
            font-size: 20px;
            color: #c9d1d9;
            width: 25px;
            text-align: center;
        }

        /* การสร้างปุ่ม Toggle Switch ด้วย CSS */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #30363d;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        /* เมื่อปุ่มถูกเปิด (Checked) ให้เปลี่ยนสีและเรืองแสง */
        input:checked + .slider {
            background-color: #00ffff;
            box-shadow: 0 0 15px #00ffff;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* ส่วนเครดิตผู้พัฒนาด้านล่าง */
        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 14px;
            color: #8b949e;
            line-height: 1.6;
        }
        .footer .dev-title {
            color: #00ffff;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <div class="header">
            <h1>SMART HOME</h1>
            <p>ESP8266 IoT Control Panel</p>
        </div>

        <div class="channel-card">
            <div class="channel-info">
                <i class="fa-solid fa-lightbulb" style="color: #ffd700;"></i>
                <span>ช่องที่ 1 (D1)</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="ch1">
                <span class="slider"></span>
            </label>
        </div>

        <div class="channel-card">
            <div class="channel-info">
                <i class="fa-solid fa-plug"></i>
                <span>ช่องที่ 2 (D2)</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="ch2">
                <span class="slider"></span>
            </label>
        </div>

        <div class="channel-card">
            <div class="channel-info">
                <i class="fa-solid fa-tv"></i>
                <span>ช่องที่ 3 (D5)</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="ch3">
                <span class="slider"></span>
            </label>
        </div>

        <div class="channel-card">
            <div class="channel-info">
                <i class="fa-solid fa-snowflake" style="color: #00ffff;"></i>
                <span>ช่องที่ 4 (D6)</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="ch4">
                <span class="slider"></span>
            </label>
        </div>

        <div class="footer">
            <span class="dev-title">ผู้พัฒนาระบบ</span>
            กชพร ศรีวัย<br>
            แผนกอิเล็กทรอนิกส์<br>
            วิทยาลัยสารพัดช่างศรีสะเกษ
        </div>
    </div>

    <script type="module">
        // นำเข้าฟังก์ชันที่จำเป็นจาก Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // ⚠️ คำแนะนำ: ให้นำค่า Config จากโปรเจกต์ Firebase ของคุณมาใส่ที่นี่
        const firebaseConfig = {
apiKey: "AIzaSyAzvU3vOgB1Dd6JTYUiya1WKN_yfcLx8-E",
  authDomain: "mylot2026-e3dc4.firebaseapp.com",
  databaseURL: "https://mylot2026-e3dc4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mylot2026-e3dc4",
  storageBucket: "mylot2026-e3dc4.firebasestorage.app",
  messagingSenderId: "771646795722",
  appId: "1:771646795722:web:25401364aef909f533a933"
        };

        // เริ่มต้นการเชื่อมต่อ Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ฟังก์ชันสำหรับจัดการปุ่มแต่ละช่อง
        function setupChannel(checkboxId, dbPath) {
            const checkbox = document.getElementById(checkboxId);
            const dbRef = ref(db, dbPath);

            // 1. อ่านค่าจาก Firebase (Real-time update) มาแสดงผลที่หน้าเว็บ
            onValue(dbRef, (snapshot) => {
                const data = snapshot.val();
                // ถ้าค่าเป็น 1 (หรือ true) ให้ปุ่มเปิด, ถ้าเป็น 0 ให้ปุ่มปิด (ปรับเปลี่ยนได้ตามที่เขียนฝั่ง NodeMCU)
                if (data === 1 || data === true || data === "ON") {
                    checkbox.checked = true;
                } else {
                    checkbox.checked = false;
                }
            });

            // 2. เมื่อผู้ใช้กดปุ่มที่หน้าเว็บ ให้ส่งค่าไปยัง Firebase
            checkbox.addEventListener('change', (e) => {
                const state = e.target.checked ? 1 : 0; // ส่ง 1 ถ้าเปิด, ส่ง 0 ถ้าปิด
                set(dbRef, state)
                    .then(() => {
                        console.log(`${dbPath} ถูกสั่งให้เปลี่ยนสถานะเป็น ${state}`);
                    })
                    .catch((error) => {
                        console.error("เกิดข้อผิดพลาดในการส่งข้อมูล: ", error);
                        // ถ้าส่งไม่สำเร็จ ให้คืนค่าปุ่มกลับไปสถานะเดิม
                        e.target.checked = !e.target.checked; 
                    });
            });
        }

        // เรียกใช้งานฟังก์ชันสำหรับทั้ง 4 ช่อง (เปลี่ยนชื่อ Path ได้ตามโครงสร้าง Database ของคุณ)
        // รูปแบบ: setupChannel('ไอดีของปุ่ม', 'ตำแหน่งใน_Firebase_Database');
        setupChannel('ch1', 'SmartHome/D1');
        setupChannel('ch2', 'SmartHome/D2');
        setupChannel('ch3', 'SmartHome/D5');
        setupChannel('ch4', 'SmartHome/D6');

    </script>
</body>
</html>
